<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../perfil.css">
    <title>Minha Conta | TrocaTicket</title>
</head>
<body class="profile-page">
    <header class="site-header">
        <a class="brand" href="../index.html">
            <img class="brand-logo" src="../imagens/logo troca ticket.png" alt="TrocaTicket">
            <span>Troca<span class="brand-accent">Ticket</span></span>
        </a>

        <a href="../index.html" class="button button-outline" style="padding: 8px 18px; font-size: 13px; text-decoration: none;">
            Voltar
        </a>
    </header>

    <main class="profile-shell">
        <section class="profile-hero" aria-label="Dados da conta">
            <label class="avatar-upload" for="avatar-input" title="Clique para alterar a foto de perfil">
                <img id="profile-avatar" src="../imagens/logo troca ticket.png" alt="Foto do perfil">
                <span class="avatar-camera" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
            </label>
            <input id="avatar-input" type="file" accept="image/png, image/jpeg, image/webp" hidden>
            <h1 id="profile-name">Carregando...</h1>
            <p id="profile-email">-</p>
        </section>

        <section class="profile-section">
            <h2><svg class="section-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14 5l2.5-.2 1.2 2.2 2.2 1.2-.2 2.5 1.5 2-1.5 2 .2 2.5-2.2 1.2-1.2 2.2L14 19l-2 1.5L10 19l-2.5.2-1.2-2.2-2.2-1.2.2-2.5-1.5-2 1.5-2-.2-2.5 2.2-1.2 1.2-2.2L10 5l2-1.5Z"></path><circle cx="12" cy="12" r="3"></circle></svg> Configurações</h2>
            <div class="profile-actions">
                <a class="profile-action" href="editar-perfil.html"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"></circle><path d="M5 20c.8-3.2 3.2-5 7-5s6.2 1.8 7 5"></path></svg>Editar perfil</a>
                <a class="profile-action" href="editar-telefone.html"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4l2 5-2.5 1.7a14 14 0 0 0 3.8 3.8L15 12l5 2v4c0 1.1-.9 2-2 2C10.8 20 4 13.2 4 6c0-1.1.9-2 2-2Z"></path></svg>Editar telefone</a>
                <a class="profile-action" href="cartoes.html"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M7 15h4"></path></svg>Meus cartões</a>
                <button class="profile-action danger" type="button" id="delete-account"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M8 10v7M12 10v7M16 10v7M6 7l1 14h10l1-14"></path></svg>Excluir conta</button>
                <button class="profile-action danger" type="button" id="profile-logout"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"></path></svg>Sair</button>
            </div>
        </section>

        <section class="profile-section profile-info">
            <h2><svg class="section-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10v6M12 7.5h.01"></path></svg> Informações</h2>
            <a class="profile-action" href="../info/ajuda.html"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9.5a2.4 2.4 0 1 1 3.8 1.9c-1 .7-1.6 1.1-1.6 2.4M12 16.8h.01"></path></svg>Central de ajuda</a>
        </section>

        <form id="profile-form" class="profile-edit-form" hidden>
            <label>Nome<input id="nome" name="nome" readonly></label>
            <label>CPF<input id="cpf" name="cpf" readonly></label>
            <label>E-mail<input id="email" name="email" type="email" required></label>
            <label>Telefone<input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="Número com DDD; separadores opcionais"></label>
            <label>Nova senha<input id="senha" name="senha" type="password" minlength="6"></label>
            <p id="profile-message" role="status"></p>
            <button class="profile-save" type="submit">Salvar alterações</button>
        </form>
    </main>

    <script src="../auth-fetch.js"></script>
    <script src="../perfil.js" defer></script>
</body>
</html>
